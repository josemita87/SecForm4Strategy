name: quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: make quality-static
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      # Lockfile vulnerabilities, secrets and Terraform misconfigurations; accepted findings are in .trivyignore
      - run: make security-scan

  type-check:
    runs-on: ubuntu-latest
    # Non-blocking until type-check joins the pre-commit hook (TODO)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: make type-check
