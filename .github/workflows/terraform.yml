name: terraform

# Plans pull requests; on master, plans the merged commit and applies exactly that plan after approval (docs/aws.md).
# Run it by hand on master to deploy images pushed since the last apply.
on:
  pull_request:
    paths: [infra/envs/**, infra/modules/**, site/**, .github/workflows/terraform.yml]
  push:
    branches: [master]
    paths: [infra/envs/**, infra/modules/**, site/**, .github/workflows/terraform.yml]
  workflow_dispatch:

permissions:
  contents: read
  # Lets the jobs ask GitHub for the OIDC token that AWS exchanges for the plan or apply role
  id-token: write

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # Marked sensitive in Terraform, so plans print (sensitive value) instead of the address
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

# Master runs queue one after another, so each plan is made after the previous apply
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/envs/demo

jobs:
  plan:
    # Pull requests from forks get no secrets and no OIDC token, so only same-repo branches are planned
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::100118195151:role/secform4strategy-github-plan
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - run: terraform init

      # Exit code 2 means the plan has changes; 1 is an error
      - id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [ "$code" -ne 1 ]
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Show the plan on the run's summary page
        run: |
          {
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The saved plan holds sensitive values in plain text, so it is kept one day only
      - if: github.event_name != 'pull_request' && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/envs/demo/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # The environment admits only master and waits for a required reviewer's approval
    environment: aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::100118195151:role/secform4strategy-github-apply
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/envs/demo

      - run: terraform init

      # Applies the reviewed plan only; Terraform refuses it if the state changed since the plan
      - run: terraform apply -no-color -lock-timeout=5m tfplan
