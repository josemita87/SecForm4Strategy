[project]
name = "scraper"
version = "0.1.0"
description = "SEC Form 4 scraper: consumes filing links from Kafka, parses transactions, and produces normalized events."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    # EDGAR HTTP and Kafka come from the shared clients package.
    "secform4strategy-clients[edgar,messaging]",
    "pydantic>=2.12,<3",
    # Form 4 XML declared as models (src/form4.py)
    "pydantic-xml>=2.17,<3",
    # zoneinfo data for the US/Eastern acceptance time on slim images
    "tzdata>=2024.1",
    "pydantic-settings>=2.10,<3",
    "xxhash>=3.5,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../../packages/secform4strategy-clients", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
markers = ["unit: fast, offline tests (tests/unit)"]
# A dependency of quixstreams (authlib) warns about its own httpx integration
filterwarnings = ["ignore::authlib.deprecate.AuthlibDeprecationWarning"]
