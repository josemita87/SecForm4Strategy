[project]
name = "scraper"
version = "0.1.0"
description = "SEC Form 4 scraper: consumes filing links from Kafka, parses transactions, and produces normalized events."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    # EDGAR HTTP and Kafka come from the shared clients package.
    "secform4strategy-clients[edgar,messaging]",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "xxhash>=3.5,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../../packages/secform4strategy-clients" }
