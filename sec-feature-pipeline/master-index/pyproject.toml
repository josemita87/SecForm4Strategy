[project]
name = "master-index"
version = "0.1.0"
description = "SEC master-index service: discovers Form 4 filing links from EDGAR and produces them to Kafka."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    # Kafka and EDGAR (master index and current-filings feed) come from the shared clients package.
    "secform4strategy-clients[messaging,edgar]",
    "pydantic-settings>=2.10,<3",
    "xxhash>=3.5,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../../packages/secform4strategy-clients" }
