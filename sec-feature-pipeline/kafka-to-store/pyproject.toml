[project]
name = "kafka-to-store"
version = "0.1.0"
description = "Consumes normalized Form 4 transactions from Kafka, cleans them, and writes to the feature store (BT4/BI4)."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "secform4strategy-clients[feature-store,messaging]",
    "pandas>=2.3.3,<2.4",
    "pydantic-settings>=2.10,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../../packages/secform4strategy-clients", editable = true }
