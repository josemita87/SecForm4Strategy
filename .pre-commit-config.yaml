# Install: uv run pre-commit install (docs/development.md)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^prices-feature-pipeline/target/src/data/  # reference data, moves to S3 in the migration
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: quality-static
        name: make quality-static (lint, docstrings, bandit, config validation, unit tests)
        entry: make quality-static
        language: system
        pass_filenames: false
        files: \.(py|ya?ml|toml)$
