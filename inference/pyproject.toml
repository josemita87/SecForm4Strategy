[project]
name = "inference"
version = "0.1.0"
description = "Loads the trained scikit-learn pipeline, scores the latest features, and optionally places orders via Alpaca."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Hopsworks feature store, Alpaca broker and the model store come from the shared clients package.
    "secform4strategy-clients[feature-store,broker,model-store]",
    # scikit-learn and numpy must match training, which pickles the saved model.
    "numpy==1.26.*",
    "scipy>=1.15.1,<2.0.0",
    "pandas<2.2.0",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "pyarrow>=19.0.0,<20.0.0",
    "scikit-learn==1.7.2",
    "joblib>=1.4,<2",
    "polars>=1.21.0,<2.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../packages/secform4strategy-clients" }
