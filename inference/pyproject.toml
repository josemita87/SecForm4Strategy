[project]
name = "inference"
version = "0.1.0"
description = "Loads the trained scikit-learn pipeline, scores the latest features, and optionally places orders via Alpaca."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Feature store, broker and model store come from the shared clients package.
    "secform4strategy-clients[feature-store,broker,model-store]",
    "pandas>=2.3.3,<2.4",
    "numpy>=2.3,<2.5",
    # scikit-learn must match between training and inference, which unpickles the saved model.
    "scikit-learn==1.9.1",
    "joblib>=1.4,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../packages/secform4strategy-clients", editable = true }
