[project]
name = "training"
version = "0.1.0"
description = "Trains a scikit-learn regressor from feature-store data, runs a trading simulation, and persists the model."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    # Feature store and model store come from the shared clients package.
    "secform4strategy-clients[feature-store,model-store]",
    "pandas>=2.3.3,<2.4",
    "numpy>=2.3,<2.5",
    # scikit-learn must match between training and inference, which unpickles the saved model.
    "scikit-learn==1.9.1",
    "joblib>=1.4,<2",
    "matplotlib>=3.10.6,<4",
    "seaborn>=0.13.2,<0.14",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../packages/secform4strategy-clients", editable = true }
