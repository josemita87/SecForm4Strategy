# Service spec (format: docs/configuration.md)

# Feature-group catalog
feature_groups:
  rt4:
    primary_key: [key]
    event_time: accepted_at

columns_to_drop: [key]
identification_features: [ticker, next_print, date, company_cik, reported_price, accepted_at, label_known_at]

# A short winner falls by more than 5% over the 30-day horizon: the classifier's positive class
short_return: -0.05

# Fixed classifier parameters; max_iter caps the boosting rounds early stopping ends
model_params:
  max_iter: 500
  early_stopping: true
  validation_fraction: 0.1

# Parameters the grid search tries on top of model_params
param_grid:
  learning_rate: [0.03, 0.1]
  max_leaf_nodes: [15, 31]
  min_samples_leaf: [50, 200]
  l2_regularization: [0.0, 1.0]
  class_weight: [null, balanced]

# Probability cutoffs tried on the development folds; the holdout is reported at each of them too
cutoff_grid: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
# A cutoff qualifies only when it shorts at least this many rows in every fold
min_fold_shorts: 100
# The cutoff used when none qualifies
fallback_cutoff: 0.5
