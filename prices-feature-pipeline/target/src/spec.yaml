# Service spec (format: docs/configuration.md)

# Feature-group catalog
feature_groups:
  p:
    primary_key: [key]  # <ticker>@<date>
    event_time: date
  bt4:
    primary_key: [key]
    event_time: accepted_at
  bi4:
    primary_key: [key]
    event_time: accepted_at
  rt4:
    primary_key: [key]
    event_time: accepted_at
  bir4:
    primary_key: [key]
    event_time: accepted_at

# Days of preceding filings counted in each row's cluster of insiders
cluster_window_days: 30
# A 30-day return above +300% is almost always a bad split adjustment, a reused ticker or a sub-penny quote
max_label_return: 3.0
