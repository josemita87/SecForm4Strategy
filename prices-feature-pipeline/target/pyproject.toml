[project]
name = "target"
version = "0.1.0"
description = "Joins insider transactions with prices to compute training targets (RT4) and inference features (BIR4)."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "secform4strategy-clients[feature-store]",
    "pandas>=2.3.3,<2.4",
    "numpy>=2.3,<2.5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../../packages/secform4strategy-clients" }
