[project]
name = "yahoo-connect"
version = "0.1.0"
description = "Fetches price history from Yahoo Finance and incrementally updates the prices (P) feature group."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    # Feature store and market data come from the shared clients package.
    "secform4strategy-clients[feature-store,market-data]",
    "pandas>=2.3.3,<2.4",
    "numpy>=2.3,<2.5",
    "pydantic-settings>=2.10,<3",
    "tqdm>=4.67.1,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../../packages/secform4strategy-clients", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
markers = ["unit: fast, offline tests (tests/unit)"]
