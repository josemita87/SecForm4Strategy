[project]
name = "secform4strategy-clients"
version = "0.1.0"
description = "Pure infrastructure clients (Iceberg feature store, Kafka, Alpaca, EDGAR, market data) shared across the SecForm4Strategy microservices."
readme = "README.md"
authors = [{ name = "Josep Cubedo Macian", email = "josep.cubedo@cabsa.es" }]
requires-python = ">=3.14"
# No hard dependencies: every SDK sits behind an extra (docs/development.md)
dependencies = []

[project.optional-dependencies]
# pyiceberg with a SQLite catalog for local runs; pydantic validates the feature_groups.yaml catalog.
feature-store = ["pyiceberg[sql-sqlite,pyarrow]>=0.12,<0.13", "pandas>=2.3", "pyyaml>=6,<7", "pydantic>=2,<3"]
model-store = ["joblib>=1.4,<2"]
broker = ["alpaca-py>=0.44,<1"]
messaging = ["quixstreams>=3.1,<4", "confluent-kafka>=2.6,<3"]
# tzdata backs zoneinfo where the OS has no timezone database (slim images)
edgar = ["requests>=2.32,<3", "tzdata>=2024.1"]
market-data = ["yfinance>=0.2.48,<0.3", "pandas>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secform4strategy_clients"]

