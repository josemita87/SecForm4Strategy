name: training-feature-pipeline

networks:
  redpanda-network:
    name: redpanda-network
    driver: bridge

# Iceberg feature store on a local SQLite catalog, shared by the services through the lakehouse volume
x-shared-environment: &shared-env
  PYICEBERG_CATALOG__DEFAULT__TYPE: sql
  PYICEBERG_CATALOG__DEFAULT__URI: sqlite:////lakehouse/catalog.db
  PYICEBERG_CATALOG__DEFAULT__WAREHOUSE: file:///lakehouse/warehouse

services:
  master-index:
    build:
      context: ../..
      dockerfile: sec-feature-pipeline/master-index/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - training-master.env
    environment:
      <<: *shared-env
      # SEC fair access: a real name and contact email from the host environment, validated at boot
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "9000:9000"
    restart:
      "on-failure:5"
    profiles:
      - sec

  scraper:
    build:
      context: ../..
      dockerfile: sec-feature-pipeline/scraper/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - training-scraper.env
    environment:
      <<: *shared-env
      # SEC fair access: a real name and contact email from the host environment, validated at boot
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "9001:9001"
    restart:
      "on-failure:5"
    depends_on:
       - master-index
    profiles:
      - sec
 

  kafka-to-store:
    build:
      context: ../..
      dockerfile: sec-feature-pipeline/kafka-to-store/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - training-feature.env
      - .env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
    ports:
      - "9002:9002"
    restart:
      "on-failure:5"
    depends_on:
      - scraper
    profiles:
      - sec

  yahoo-connect:
    build:
      context: ../..
      dockerfile: prices-feature-pipeline/yahoo_connect/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - training-yahoo.env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
    ports:
      - "9003:9003"
    restart:
      "on-failure:5"
    profiles:
      - prices

  target:
    build:
      context: ../..
      dockerfile: prices-feature-pipeline/target/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - training-target.env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
    ports:
      - "9005:9005"
    restart:
      "on-failure:5"
    depends_on:
      yahoo-connect:
        condition: service_completed_successfully
    profiles:
      - prices

  # Fits the model on RT4 and saves it with its metadata to .artifacts/, where inference loads it
  training:
    build:
      context: ../..
      dockerfile: training/Dockerfile
    env_file:
      - training-model.env
    environment:
      <<: *shared-env
      GIT_SHA: ${GIT_SHA:-}
    volumes:
      - ../../.lakehouse:/lakehouse
      - ../../.artifacts:/artifacts
    profiles:
      - model
