name: inference-feature-pipeline

networks:
  redpanda-network:
    name: redpanda-network
    driver: bridge

# Iceberg feature store on a local SQLite catalog, shared by the services through the lakehouse volume
x-shared-environment: &shared-env
  PYICEBERG_CATALOG__DEFAULT__TYPE: sql
  PYICEBERG_CATALOG__DEFAULT__URI: sqlite:////lakehouse/catalog.db
  PYICEBERG_CATALOG__DEFAULT__WAREHOUSE: file:///lakehouse/warehouse

services:
  master-index:
    build:
      context: ../..
      dockerfile: sec-feature-pipeline/master-index/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - inference-master.env
    environment:
      <<: *shared-env
      # SEC fair access: a real name and contact email from the host environment, validated at boot
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "8000:8000"
    restart:
      "on-failure:5"
    profiles:
      - sec

  scraper:
    build:
      context: ../..
      dockerfile: sec-feature-pipeline/scraper/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - inference-scraper.env
    environment:
      <<: *shared-env
      # SEC fair access: a real name and contact email from the host environment, validated at boot
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "8001:8001"
    restart:
      "on-failure:5"
    depends_on:
       - master-index
    profiles:
      - sec
 

  kafka-to-store:
    build:
      context: ../..
      dockerfile: sec-feature-pipeline/kafka-to-store/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - inference-feature.env
      - .env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
    ports:
      - "8002:8002"
    restart:
      "on-failure:5"
    profiles:
      - sec

  yahoo-connect:
    build:
      context: ../..
      dockerfile: prices-feature-pipeline/yahoo_connect/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - inference-yahoo.env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
    ports:
      - "8003:8003"
    restart:
      "on-failure:5"
    profiles:
      - prices

  target:
    build:
      context: ../..
      dockerfile: prices-feature-pipeline/target/Dockerfile
    networks:
      - redpanda-network
    env_file:
      - inference-target.env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
    ports:
      - "8005:8005"
    restart:
      "on-failure:5"
    depends_on:
      yahoo-connect:
        condition: service_completed_successfully
    profiles:
      - prices

  # Scores the newest BIR4 rows with the model training saved in .artifacts/ and places paper orders on Alpaca
  inference:
    build:
      context: ../..
      dockerfile: inference/Dockerfile
    env_file:
      - inference-model.env
      - .credentials.env
    environment:
      <<: *shared-env
    volumes:
      - ../../.lakehouse:/lakehouse
      - ../../.artifacts:/artifacts
    profiles:
      - model
