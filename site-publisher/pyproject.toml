[project]
name = "site-publisher"
version = "0.1.0"
description = "Publishes the demo site's JSON: live-score runs, stack health, the Alpaca paper portfolio, the model report and recent insider sales."
authors = [{ name = "Josep Cubedo Macian", email = "136491450+josemita87@users.noreply.github.com" }]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Every adapter the publisher reads or writes comes from the shared clients package.
    "secform4strategy-clients[aws,broker,cloudwatch,feature-store,market-data,model-store,s3-site,scheduler,stepfunctions]",
    "pandas>=2.3.3,<2.4",
    "numpy>=2.3,<2.5",
    # scikit-learn must match training, which pickled the model the report unpickles.
    "scikit-learn==1.9.1",
    "boto3>=1.35,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    # Lambda runtime interface client: the publisher runs src/handler.py in this image
    "awslambdaric>=4.2,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
secform4strategy-clients = { path = "../packages/secform4strategy-clients", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
markers = ["unit: fast, offline tests (tests/unit)"]
